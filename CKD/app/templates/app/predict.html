<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CKD Prediction</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        /* 🌌 THEME 1B — Deep Purple + Neon Pink */
        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(135deg, #1a0033, #2a0055, #3f0077);
            min-height: 100vh;
            padding-bottom: 60px;
            margin: 0;
            color: #f0e6ff;
        }

        /* 🔮 Glass Header */
        .header {
            background: rgba(255, 255, 255, 0.08);
            padding: 2rem 0;
            text-align: center;
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            color: #f8d9ff;
        }

        .header h1 {
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        /* 🟣 Glass Cards */
        .form-card,
        .csv-card {
            border-radius: 18px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
            color: #f8eaff;
        }

        /* Headings */
        .section-title {
            font-size: 1.7rem;
            font-weight: 700;
            text-align: center;
            color: #ffb3ff;
        }

        /* Inputs — remove border, soft backgrounds */
        .form-control,
        .form-select {
            border: none !important;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            background: rgba(255, 255, 255, 0.15) !important;
            color: white;
            transition: 0.25s;
        }

        .form-control::placeholder {
            color: #e6cfff;
        }

        .form-control:focus,
        .form-select:focus {
            background: rgba(255, 255, 255, 0.25) !important;
            box-shadow: 0 0 0 3px rgba(255, 0, 183, 0.3) !important;
            color: white;
        }

        .form-label {
            font-weight: 600;
            color: #ffe0ff;
        }

        /* Buttons — Neon Pink Glow */
        .btn-primary {
            background: linear-gradient(90deg, #ff0099, #ff33cc);
            border: none;
            padding: 14px 35px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
            transition: 0.3s;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 0, 180, 0.5);
        }

        .btn-success {
            background: linear-gradient(90deg, #b300ff, #ff00aa);
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-weight: 600;
            color: white;
        }

        .btn-success:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(195, 0, 255, 0.5);
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 70px;
            padding: 20px;
            color: #e6cfff;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="header shadow-sm mb-5">
        <h1><i class="fa-solid fa-kidneys me-2"></i>Chronic Kidney Disease (CKD) Predictor</h1>
    </header>

    <div class="container main-container my-4" style="max-width: 900px;">

        {% if error_message %}
        <div class="alert alert-danger">{{ error_message }}</div>
        {% endif %}

        <!-- Manual Prediction Form -->
        <form method="post" class="form-card p-4 p-md-5">
            {% csrf_token %}
            <h3 class="section-title"><i class="fa-solid fa-user-doctor me-2"></i>Enter Patient Details</h3>

            <div class="row g-4">

                <!-- All your inputs remain EXACT SAME — only style changed -->
                <div class="col-md-4 col-sm-6"><label class="form-label">Age</label><input type="number" name="age" class="form-control" required /></div>
                <div class="col-md-4 col-sm-6"><label class="form-label">Blood Pressure</label><input type="number" name="bp" class="form-control" required /></div>
                <div class="col-md-4 col-sm-6"><label class="form-label">Blood Glucose</label><input type="number" name="bgr" class="form-control" required /></div>

                <div class="col-md-4 col-sm-6"><label class="form-label">Blood Urea</label><input type="number" name="bu" class="form-control" required /></div>
                <div class="col-md-4 col-sm-6"><label class="form-label">Serum Creatinine</label><input type="number" name="sc" class="form-control" required /></div>
                <div class="col-md-4 col-sm-6"><label class="form-label">Sodium</label><input type="number" name="sod" class="form-control" required /></div>

                <div class="col-md-4 col-sm-6"><label class="form-label">Potassium</label><input type="number" name="pot" class="form-control" required /></div>
                <div class="col-md-4 col-sm-6"><label class="form-label">Hemoglobin</label><input type="number" name="hemo" class="form-control" required /></div>
                <div class="col-md-4 col-sm-6"><label class="form-label">PCV</label><input type="number" name="pcv" class="form-control" required /></div>

                <div class="col-md-4 col-sm-6"><label class="form-label">WBC Count</label><input type="number" name="wbcc" class="form-control" required /></div>
                <div class="col-md-4 col-sm-6"><label class="form-label">RBC Count</label><input type="number" name="rbcc" class="form-control" required /></div>

                <!-- Select Fields -->
                <div class="col-md-4 col-sm-6">
                    <label class="form-label">Specific Gravity</label>
                    <select name="sg" class="form-select">
                        <option value="1.005">1.005</option>
                        <option value="1.010">1.010</option>
                        <option value="1.015">1.015</option>
                        <option value="1.020">1.020</option>
                        <option value="1.025">1.025</option>
                    </select>
                </div>

                <div class="col-md-4 col-sm-6">
                    <label class="form-label">Albumin</label>
                    <select name="al" class="form-select">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <div class="col-md-4 col-sm-6">
                    <label class="form-label">Sugar</label>
                    <select name="su" class="form-select">
                        <option value="0">0</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                    </select>
                </div>

                <div class="col-md-4 col-sm-6"><label class="form-label">Red Blood Cells</label>
                    <select name="rbc" class="form-select">
                        <option value="1">Normal</option>
                        <option value="0">Abnormal</option>
                    </select>
                </div>

                <div class="col-md-4 col-sm-6"><label class="form-label">Pus Cell</label>
                    <select name="pc" class="form-select">
                        <option value="1">Normal</option>
                        <option value="0">Abnormal</option>
                    </select>
                </div>

                <div class="col-md-4 col-sm-6"><label class="form-label">Pus Cell Clumps</label>
                    <select name="pcc" class="form-select">
                        <option value="0">Not Present</option>
                        <option value="1">Present</option>
                    </select>
                </div>

                <div class="col-md-4 col-sm-6"><label class="form-label">Bacteria</label>
                    <select name="ba" class="form-select">
                        <option value="0">Not Present</option>
                        <option value="1">Present</option>
                    </select>
                </div>

                <div class="col-md-4 col-sm-6"><label class="form-label">Hypertension</label>
                    <select name="htn" class="form-select">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="col-md-4 col-sm-6"><label class="form-label">Diabetes Mellitus</label>
                    <select name="dm" class="form-select">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="col-md-4 col-sm-6"><label class="form-label">Coronary Artery Disease</label>
                    <select name="cad" class="form-select">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="col-md-4 col-sm-6"><label class="form-label">Appetite</label>
                    <select name="appet" class="form-select">
                        <option value="1">Good</option>
                        <option value="0">Poor</option>
                    </select>
                </div>

                <div class="col-md-4 col-sm-6"><label class="form-label">Pedal Edema</label>
                    <select name="pe" class="form-select">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>

                <div class="col-md-4 col-sm-6"><label class="form-label">Anemia</label>
                    <select name="ane" class="form-select">
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
            </div>

            <div class="text-center mt-5">
                <button type="submit" class="btn btn-primary btn-lg">
                    <i class="fa-solid fa-magnifying-glass-chart me-2"></i>Predict Risk
                </button>
            </div>
        </form>

        <div class="text-center my-4"><span class="fw-bold" style="color:#ffd6ff">OR</span></div>

        {% if csv_error %}
        <div class="alert alert-danger">{{ csv_error }}</div>
        {% endif %}

        <!-- CSV Upload -->
        <form method="post" enctype="multipart/form-data" class="csv-card p-4 p-md-5">
            {% csrf_token %}
            <input type="hidden" name="csv_submit" value="1" />

            <h5 class="text-center mb-3" style="color:#ffb3ff;"><i class="fa-solid fa-file-csv me-2"></i>Quick Predict (CSV)</h5>

            <input type="file" name="csv_file" accept=".csv" class="form-control form-control-lg mb-3" required />

            <div class="text-center">
                <button type="submit" class="btn btn-success btn-lg">
                    <i class="fa-solid fa-upload me-2"></i>Predict From CSV
                </button>
            </div>
        </form>
    </div>

    <footer class="footer">CKD Prediction Model</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
