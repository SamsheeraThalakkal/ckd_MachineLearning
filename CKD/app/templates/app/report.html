<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Report</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
        body {
            font-family: "Inter", sans-serif;
            background: linear-gradient(90deg, #4b3404, #a57112);
            color: #f0e6ff;
            min-height: 100vh;
            padding-bottom: 60px;
        }

        .header {
            background: rgba(255, 255, 255, 0.08);
            padding: 2rem 0;
            text-align: center;
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            color: #0a090a;
        }

        .header h2 {
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .top-right-buttons {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 9999;
        }

        .top-right-buttons a {
            background: linear-gradient(90deg, #03411d, #08db48);
            color: white;
            padding: 10px 22px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 6px 15px rgba(3, 48, 2, 0.4);
            transition: 0.3s;
        }

        .top-right-buttons a:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 18px rgba(50, 226, 6, 0.6);
        }

        .report-card {
            border-radius: 18px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
            color: #f8eaff;
            padding: 2rem;
            margin-top: 30px;
        }
  table {
    width: 100% !important;
    border-collapse: collapse !important;
    background-color: #614907 !important;  /* dark violet */
}

th, td {
    padding: 12px !important;
    border: 1px solid #ffffff !important;
    color: #ffffff !important;  /* force white text */
    background-color: #4d2805 !important;
}
        
        .btn-custom {
            margin-top: 15px;
            background: linear-gradient(90deg, #064e16, #208a3b);
            border: none;
            color: #fff;
            padding: 10px 25px;
            border-radius: 12px;
            font-weight: 600;
            text-decoration: none;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(30, 236, 30, 0.5);
        }

        .footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #e6cfff;
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header class="header shadow-sm mb-5">
        <h2><i class="fa-solid fa-file-medical me-2"></i>Patient Report</h2>
    </header>

    <!-- Top-right buttons -->
    <div class="top-right-buttons">
        <a href="{% url 'home' %}"><i class="fa-solid fa-house me-2"></i>Home</a>
        <a href="{% url 'predict' %}"><i class="fa-solid fa-arrow-left me-2"></i>Prediction</a>
    </div>

    <!-- Report Table -->
    <div class="container" style="max-width: 900px;">
        <div class="report-card">

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% else %}
                <div class="table-responsive">
                    <table class="table table-hover table-borderless">
                        <thead>
                            <tr>
                                <th>Test Description</th>
                                <th>Result</th>
                                <th>Normal Range</th>
                                <th>Unit</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for row in report_list %}
                                <tr>
                                    <td>{{ row.feature }}</td>
                                    <td>{{ row.value }}</td>
                                    <td>{{ row.normal }}</td>
                                    <td>{{ row.unit }}</td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>

                <div class="text-center">
                    <a href="{% url 'predict' %}" class="btn btn-custom me-3">
                        <i class="fa-solid fa-arrow-left me-2"></i>Back to Prediction
                    </a>
                    <a href="?download=true" class="btn btn-custom">
                        <i class="fa-solid fa-download me-2"></i>Download CSV
                    </a>
                </div>
            {% endif %}
        </div>
    </div>

    <footer class="footer">CKD Prediction Model</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
